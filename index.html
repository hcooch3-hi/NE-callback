<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ネクストエンジン認証コード受け取り</title>
<style>
  body {
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px 0;
  }
  .card {
    background: #fff;
    padding: 32px 40px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    max-width: 560px;
    width: 90%;
  }
  h1 { font-size: 18px; margin-top: 0; }
  .row { margin: 20px 0; }
  label { font-size: 13px; color: #555; display: block; margin-bottom: 4px; }
  .code-box {
    background: #f0f0f0;
    padding: 12px 16px;
    border-radius: 4px;
    word-break: break-all;
    font-family: monospace;
    font-size: 14px;
    min-height: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .code-text { flex: 1; }
  button {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
  }
  button:hover { background: #1d4ed8; }
  .empty { color: #999; }
  .copied { color: #16a34a; font-size: 12px; }
  .notice { font-size: 13px; color: #b45309; background: #fffbeb; padding: 10px 14px; border-radius: 4px; margin-top: 16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>ネクストエンジン 認証情報</h1>
    <p>以下の値を、アクセストークン取得スクリプトに貼り付けてください。</p>

    <div class="row">
      <label>uid</label>
      <div class="code-box">
        <span class="code-text" id="uidBox"><span class="empty">見つかりません</span></span>
        <button onclick="copyValue('uid')">コピー</button>
      </div>
    </div>

    <div class="row">
      <label>state</label>
      <div class="code-box">
        <span class="code-text" id="stateBox"><span class="empty">見つかりません</span></span>
        <button onclick="copyValue('state')">コピー</button>
      </div>
    </div>

    <div class="row">
      <label>code（別方式の場合）</label>
      <div class="code-box">
        <span class="code-text" id="codeBox"><span class="empty">見つかりません</span></span>
        <button onclick="copyValue('code')">コピー</button>
      </div>
    </div>

    <div class="notice">state は発行から5分間のみ有効です。早めにアクセストークン取得の処理を行ってください。</div>
  </div>

  <script>
    function getParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }
    const values = { uid: getParam('uid'), state: getParam('state'), code: getParam('code') };
    for (const key in values) {
      const el = document.getElementById(key + 'Box');
      if (values[key]) {
        el.textContent = values[key];
      }
    }
    function copyValue(key) {
      const v = values[key];
      if (!v) return;
      navigator.clipboard.writeText(v);
      const el = document.getElementById(key + 'Box');
      const original = el.textContent;
      const msg = document.createElement('span');
      msg.className = 'copied';
      msg.textContent = ' コピーしました';
      el.appendChild(msg);
      setTimeout(() => { if (el.contains(msg)) el.removeChild(msg); }, 2000);
    }
  </script>
</body>
</html>
