<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ネクストエンジン認証コード受け取り</title>
<style>
  body {
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: #fff;
    padding: 32px 40px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    max-width: 560px;
    width: 90%;
  }
  h1 { font-size: 18px; margin-top: 0; }
  .code-box {
    background: #f0f0f0;
    padding: 16px;
    border-radius: 4px;
    word-break: break-all;
    font-family: monospace;
    font-size: 14px;
    margin: 16px 0;
    min-height: 20px;
  }
  button {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #1d4ed8; }
  .empty { color: #999; }
  .copied { color: #16a34a; font-size: 13px; margin-left: 8px; }
</style>
</head>
<body>
  <div class="card">
    <h1>ネクストエンジン 認証コード</h1>
    <p>以下のコードをコピーして、受注データ取得スクリプトに貼り付けてください。</p>
    <div class="code-box" id="codeBox"><span class="empty">コードが見つかりませんでした</span></div>
    <button onclick="copyCode()">コピー</button>
    <span class="copied" id="copiedMsg" style="display:none;">コピーしました</span>
  </div>

  <script>
    function getParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }
    const code = getParam('code');
    if (code) {
      document.getElementById('codeBox').textContent = code;
    }
    function copyCode() {
      if (!code) return;
      navigator.clipboard.writeText(code).then(() => {
        const msg = document.getElementById('copiedMsg');
        msg.style.display = 'inline';
        setTimeout(() => msg.style.display = 'none', 2000);
      });
    }
  </script>
</body>
</html>
